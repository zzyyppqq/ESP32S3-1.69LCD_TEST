[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; change microcontroller
board_build.mcu = esp32
; change MCU frequeny
board_build.f_cpu = 240000000L

board_build.partitions = my_esp32.csv

monitor_speed = 115200
upload_speed = 460800

board_build.flash_size = 4MB
; 优化代码大小
;build_flags = -Os


lib_deps =
    bodmer/TFT_eSPI@^2.5.31
;    lvgl/lvgl@^8.2.0
;    lvgl/lv_examples@^8.2.0
;src_filter = +<src> +<lib/lv_examples/src>
;src_filter += +<src> +<lib/lv_demos/src>

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=280
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=-1
    -D TFT_BL=16
    -D TFT_BACKLIGHT_ON=LOW
    -D TFT_RGB_ORDER=TFT_RGB
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_FONT8N=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000